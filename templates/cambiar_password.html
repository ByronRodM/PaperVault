<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña — PaperVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }
        .logo-wrap img { height: 40px; }
        .logo-wrap span {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }
        .notice {
            background: #1e3a5f;
            border: 1px solid #2563eb;
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.83rem;
            color: #93c5fd;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .notice i { margin-right: 0.35rem; }
        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.92rem;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: -0.6rem;
            margin-bottom: 1rem;
        }
        .error {
            background: #450a0a;
            border: 1px solid #dc2626;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.83rem;
            color: #fca5a5;
            margin-bottom: 1.25rem;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.85rem;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/static/logo.png" alt="PaperVault">
            <span>PaperVault</span>
        </div>

        <div class="notice">
            <i class="bi bi-shield-lock"></i>
            <strong>Cambio de contraseña requerido.</strong><br>
            Por seguridad, debes establecer una nueva contraseña antes de continuar.
            Mínimo 8 caracteres.
        </div>

        <h2>Nueva contraseña</h2>

        {% if error %}
        <div class="error"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="post" action="/cambiar-password">
            <label for="password_nuevo">Nueva contraseña</label>
            <input type="password" id="password_nuevo" name="password_nuevo"
                   placeholder="Mínimo 8 caracteres" required autofocus>

            <label for="password_confirmar">Confirmar contraseña</label>
            <input type="password" id="password_confirmar" name="password_confirmar"
                   placeholder="Repite la contraseña" required>
            <p class="hint">Usa letras, números y símbolos para mayor seguridad.</p>

            <button type="submit">
                <i class="bi bi-check-lg"></i> Establecer contraseña y continuar
            </button>
        </form>
    </div>
</body>
</html>
